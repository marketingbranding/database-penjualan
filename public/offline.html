<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#9ccc4e">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Oasis Next sedang offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Helvetica, Arial, sans-serif;
            background: #ecece9;
            color: #1d2219;
        }
        * { box-sizing: border-box; }
        html, body { min-width: 0; min-height: 100%; margin: 0; overflow-x: hidden; }
        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            place-items: center;
            padding: 24px;
            background: #ecece9;
        }
        .panel {
            width: 100%;
            max-width: 400px;
            border: 1px solid #d7d9d1;
            background: #fff;
            box-shadow: 0 18px 50px rgb(29 34 25 / 12%);
            padding: 24px;
            text-align: center;
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: transparent;
            display: grid;
            place-items: center;
        }
        .mark img {
            width: 64px;
            height: 64px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin: 0 0 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 20px;
        }
        button {
            min-height: 44px;
            width: 100%;
            border: 0;
            border-radius: 12px;
            background: #9ccc4e;
            color: #1d2219;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }
        button:hover { background: #5f9a2a; color: #fff; }
        button:focus-visible { outline: 3px solid #9ccc4e; outline-offset: 2px; }
        .note {
            margin-top: 16px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="mark"><img src="/brand/oasis-next-mark.svg" alt="Oasis Next"></div>
        <h1>Oasis Next sedang offline</h1>
        <p>Koneksi internet tidak tersedia. Sambungkan kembali perangkat Anda ke internet, lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
        <p class="note">Aplikasi tidak menyimpan data penjualan saat offline. Anda tetap dapat membukanya setelah koneksi pulih.</p>
    </div>
</body>
</html>
